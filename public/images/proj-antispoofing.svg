<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Face anti-spoofing: a camera frame is cropped by MediaPipe, scored by EfficientNet-B0 with CBAM attention, and classified live or spoof in real time">
  <defs>
    <radialGradient id="as-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6b4ad6" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#6b4ad6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t  { font-family: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
      .h  { font-size: 34px; font-weight: 600; fill: #eae5ec; }
      .s  { font-size: 22px; font-weight: 400; fill: #c2a4ff; }
      .n  { font-size: 25px; font-weight: 600; fill: #eae5ec; }
      .m  { font-size: 20px; font-weight: 400; fill: #9b93a8; }
      .k  { font-size: 18px; font-weight: 600; fill: #c2a4ff; letter-spacing: 1px; }
    </style>
  </defs>

  <circle cx="120" cy="130" r="250" fill="url(#as-glow)"/>
  <circle cx="890" cy="560" r="230" fill="url(#as-glow)"/>
  <rect x="24" y="24" width="952" height="592" rx="22" fill="#100e16" stroke="#2a2733" stroke-width="1.5"/>

  <text class="t h" x="64" y="94">Real-time liveness</text>
  <text class="t s" x="64" y="130">EfficientNet-B0 + CBAM · 90% accuracy · 14.8 FPS</text>

  <!-- camera frame with tracking brackets (no drawn face) -->
  <rect x="64" y="186" width="248" height="248" rx="14" fill="#15131f" stroke="#332f40"/>
  <g stroke="#c2a4ff" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M112 246 v-26 h26"/>
    <path d="M264 246 v-26 h-26"/>
    <path d="M112 374 v26 h26"/>
    <path d="M264 374 v26 h-26"/>
  </g>
  <rect x="112" y="220" width="152" height="180" fill="none" stroke="#8b6cf0" stroke-width="1.5" stroke-dasharray="6 6"/>
  <g fill="#eae5ec">
    <circle cx="150" cy="276" r="4"/><circle cx="226" cy="276" r="4"/>
    <circle cx="188" cy="312" r="4"/>
    <circle cx="156" cy="352" r="4"/><circle cx="220" cy="352" r="4"/>
  </g>
  <text class="t m" x="88" y="212">CAMERA</text>

  <path d="M328 310 h46" stroke="#5b5470" stroke-width="2.5" fill="none"/>
  <path d="M366 302 l12 8 -12 8 z" fill="#5b5470"/>

  <!-- mediapipe crop -->
  <rect x="390" y="186" width="168" height="248" rx="14" fill="#171522" stroke="#332f40"/>
  <text class="t k" x="414" y="218">01 CROP</text>
  <text class="t n" x="414" y="258">MediaPipe</text>
  <text class="t m" x="414" y="290">face region</text>
  <rect x="414" y="316" width="118" height="92" rx="8" fill="#211d30" stroke="#4a3f73"/>
  <rect x="432" y="334" width="82" height="56" rx="5" fill="none" stroke="#8b6cf0" stroke-width="2"/>

  <path d="M574 310 h46" stroke="#5b5470" stroke-width="2.5" fill="none"/>
  <path d="M612 302 l12 8 -12 8 z" fill="#5b5470"/>

  <!-- CBAM attention -->
  <rect x="636" y="186" width="300" height="248" rx="14" fill="#171522" stroke="#4a3f73"/>
  <text class="t k" x="660" y="218">02 ATTEND</text>
  <text class="t n" x="660" y="258">EfficientNet-B0</text>
  <text class="t m" x="660" y="290">CBAM attention map</text>
  <g>
    <rect x="660" y="312" width="42" height="42" rx="5" fill="#2a2440"/>
    <rect x="708" y="312" width="42" height="42" rx="5" fill="#4b3f84"/>
    <rect x="756" y="312" width="42" height="42" rx="5" fill="#8b6cf0"/>
    <rect x="804" y="312" width="42" height="42" rx="5" fill="#4b3f84"/>
    <rect x="852" y="312" width="42" height="42" rx="5" fill="#2a2440"/>
    <rect x="660" y="360" width="42" height="42" rx="5" fill="#3a3161"/>
    <rect x="708" y="360" width="42" height="42" rx="5" fill="#8b6cf0"/>
    <rect x="756" y="360" width="42" height="42" rx="5" fill="#c2a4ff"/>
    <rect x="804" y="360" width="42" height="42" rx="5" fill="#8b6cf0"/>
    <rect x="852" y="360" width="42" height="42" rx="5" fill="#3a3161"/>
  </g>

  <!-- verdict -->
  <rect x="64" y="482" width="872" height="104" rx="14" fill="#141220" stroke="#2a2733"/>
  <text class="t k" x="92" y="522">03 DECIDE</text>
  <rect x="92" y="534" width="180" height="40" rx="20" fill="#16331f" stroke="#2f7d4f"/>
  <circle cx="118" cy="554" r="7" fill="#48c07a"/>
  <text class="t n" x="136" y="562">Live  0.97</text>
  <rect x="292" y="534" width="190" height="40" rx="20" fill="#2e1820" stroke="#7d3140"/>
  <circle cx="318" cy="554" r="7" fill="#e5737f"/>
  <text class="t n" x="336" y="562">Spoof  0.03</text>
  <text class="t m" x="540" y="548">print · replay · mask</text>
  <text class="t m" x="540" y="578">rejected in one frame</text>
</svg>
